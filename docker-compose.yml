version: '3.8'
services:
  postgres:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: perf
      POSTGRES_PASSWORD: perf
      POSTGRES_DB: perf
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  service-a:
    build: ./service-a
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/perf
      SPRING_DATASOURCE_USERNAME: perf
      SPRING_DATASOURCE_PASSWORD: perf
    ports:
      - "8081:8081"
    restart: unless-stopped

  service-c:
    build: ./service-c
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/perf
      SPRING_DATASOURCE_USERNAME: perf
      SPRING_DATASOURCE_PASSWORD: perf
    ports:
      - "8082:8082"
    restart: unless-stopped

  service-d:
    build: ./service-d
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/perf
      SPRING_DATASOURCE_USERNAME: perf
      SPRING_DATASOURCE_PASSWORD: perf
    ports:
      - "8083:8083"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    depends_on:
      - service-a
      - service-c
      - service-d

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
      - influxdb
    volumes:
      - grafana-data:/var/lib/grafana

  influxdb:
    image: influxdb:2
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminadmin
      DOCKER_INFLUXDB_INIT_ORG: perf
      DOCKER_INFLUXDB_INIT_BUCKET: jmeter
    volumes:
      - influxdb-data:/var/lib/influxdb2

volumes:
  postgres-data:
  grafana-data:
  influxdb-data: