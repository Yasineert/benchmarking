## Configuration for variant A (Jersey + Hibernate)
# Server listens on a dedicated port to avoid clashes with other variants
server.port=8081

# DataSource configuration (overridden by docker‑compose environment variables)
spring.datasource.url=jdbc:postgresql://localhost:5432/perf
spring.datasource.username=perf
spring.datasource.password=perf
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Expose only the prometheus endpoint (and health/info) by default
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# Set application name for Prometheus metrics tags
spring.application.name=service-a