## Configuration for variant D (Spring Data REST)
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/perf
spring.datasource.username=perf
spring.datasource.password=perf
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Expose Prometheus endpoint
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

spring.application.name=service-d

# Data REST configuration: disable HAL if desired for performance. Uncomment to disable HAL.
# spring.hateoas.use-hal-as-default-json-media-type=false